## ============================================================
## Exit Interview Agent — Configuration File
## ============================================================
## HR teams can update questions and settings here
## WITHOUT touching any Python code.
## ============================================================

interview:
  company_name: "Acme Corp"
  max_follow_ups: 2             # Max follow-up questions per core question
  model_interviewer: "claude-haiku-4-5-20251001"   # Fast + empathetic for conversation
  model_analyst: "claude-sonnet-4-6"               # High-quality for insight analysis
  temperature: 0.7              # 0=deterministic, 1=creative

questions:
  - id: "Q1"
    category: "primary_reason"
    text: "What is the primary reason for your decision to leave the organization?"
    required: true

  - id: "Q2"
    category: "overall_experience"
    text: "How would you describe your overall experience working here over your tenure?"
    required: true

  - id: "Q3"
    category: "positives"
    text: "What did you enjoy most or find most valuable about working here?"
    required: true

  - id: "Q4"
    category: "improvements"
    text: "What specific improvements would you suggest to make this a better workplace?"
    required: true

  - id: "Q5"
    category: "relationships"
    text: "How would you describe your working relationship with your manager and immediate team?"
    required: true

  - id: "Q6"
    category: "recommendation"
    text: "Would you recommend this company to a friend or peer as a place to work? Why or why not?"
    required: false

red_flags:
  keywords:
    - harassment
    - discrimination
    - hostile
    - toxic
    - illegal
    - lawsuit
    - retaliation
    - threatened
    - abused
    - unsafe
    - sexist
    - racist
    - bullying
    - forced
  alert_message: "⚠️  HR ESCALATION FLAG: This response may require immediate HR attention."
